name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to publish, for example v0.1.1
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ steps.tag.outputs.value }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep zsh

      - name: Validate release candidate
        run: |
          zsh -n bin/cx libexec/codex-orbit.zsh codex-orbit.zsh
          sh -n install.sh uninstall.sh scripts/build-release-archive.sh scripts/test-integration.sh scripts/test-state-locking.sh
          python3 -m py_compile libexec/codex-orbit-shared-home.py libexec/codex-orbit-share.py libexec/codex-orbit-quota.py libexec/codex-orbit-daemon.py
          ./scripts/test-state-locking.sh
          ./scripts/test-integration.sh

      - name: Build source archive
        id: build
        run: |
          eval "$(./scripts/build-release-archive.sh "$RUNNER_TEMP/dist" "${{ steps.tag.outputs.value }}")"
          echo "path=${ARCHIVE_PATH}" >> "$GITHUB_OUTPUT"
          echo "sha256=${ARCHIVE_SHA256}" >> "$GITHUB_OUTPUT"
          echo "version=${ARCHIVE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.value }}"
          archive="${{ steps.build.outputs.path }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$archive" --clobber
          else
            gh release create "$tag" "$archive" --title "$tag" --generate-notes
          fi
