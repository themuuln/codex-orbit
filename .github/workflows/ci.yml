name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep zsh

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v rg >/dev/null 2>&1 || {
            echo "ripgrep is required on the macOS runner" >&2
            exit 1
          }

      - name: Validate shell and Python files
        run: |
          zsh -n bin/cx libexec/codex-orbit.zsh codex-orbit.zsh
          sh -n install.sh uninstall.sh scripts/build-release-archive.sh scripts/test-integration.sh scripts/test-state-locking.sh
          python3 -m py_compile libexec/codex-orbit-shared-home.py libexec/codex-orbit-share.py libexec/codex-orbit-quota.py libexec/codex-orbit-daemon.py

      - name: Build macOS menu bar app
        if: runner.os == 'macOS'
        run: |
          swift build --package-path macos/CodexOrbitMenu

      - name: State And Locking Tests
        run: |
          ./scripts/test-state-locking.sh

      - name: Integration smoke test
        run: |
          ./scripts/test-integration.sh
